<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>İş Yönetim</title>

  <style>

    :root{
      --nav:#102a43;
      --blue:#1675e8;
      --blue-dark:#0f63c9;
      --bg:#f4f7fb;
      --line:#e2e8f0;
      --text:#182334;
      --muted:#728096;
      --green:#16a36a;
      --red:#df4654;
      --white:#ffffff;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:
        radial-gradient(
          circle at top left,
          #e9f2ff 0,
          transparent 35%
        ),
        var(--bg);
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px 20px;
    }

    .auth-card{
      width:min(470px,100%);
      background:rgba(255,255,255,.96);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:
        0 20px 60px rgba(16,42,67,.12);
      padding:34px;
    }

    /* ==================================================
       LOGO + BAŞLIK
    ================================================== */

    .brand{
      text-align:center;
      margin-bottom:28px;
    }

    .brand-logo{
      width:108px;
      height:108px;
      margin:0 auto 18px;
      border-radius:22px;
      overflow:hidden;
      background:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:
        0 10px 25px rgba(0,0,0,.10);
    }

    .brand-logo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .brand h1{
      margin:0;
      font-size:30px;
      line-height:1.15;
      font-weight:800;
      letter-spacing:-.5px;
    }

    .brand p{
      margin:9px auto 0;
      max-width:340px;
      font-size:14px;
      line-height:1.6;
      color:var(--muted);
    }

    /* ==================================================
       SEKME
    ================================================== */

    .tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:5px;
      background:#eef3f8;
      border-radius:11px;
      padding:4px;
      margin-bottom:22px;
    }

    .tabs button{
      border:0;
      background:transparent;
      color:#607086;
      padding:11px 14px;
      border-radius:8px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      transition:.2s ease;
    }

    .tabs button:hover{
      color:var(--text);
    }

    .tabs button.active{
      background:var(--white);
      color:var(--blue);
      box-shadow:0 2px 8px rgba(16,42,67,.08);
    }

    /* ==================================================
       FORM
    ================================================== */

    .form{
      display:grid;
      gap:14px;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .field{
      display:flex;
      flex-direction:column;
    }

    .field label{
      font-size:12px;
      font-weight:700;
      margin-bottom:6px;
      color:#344256;
    }

    .field input,
    .field textarea{
      width:100%;
      border:1px solid #d6dee9;
      background:#fff;
      color:var(--text);
      padding:12px 13px;
      border-radius:9px;
      font:inherit;
      font-size:14px;
      outline:none;
      transition:.2s ease;
    }

    .field textarea{
      min-height:90px;
      resize:vertical;
    }

    .field input::placeholder,
    .field textarea::placeholder{
      color:#a0acbb;
    }

    .field input:focus,
    .field textarea:focus{
      border-color:var(--blue);
      box-shadow:
        0 0 0 3px rgba(22,117,232,.10);
    }

    /* ==================================================
       BUTON
    ================================================== */

    .btn{
      width:100%;
      border:0;
      background:var(--blue);
      color:#fff;
      padding:13px 16px;
      border-radius:9px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      transition:.2s ease;
      margin-top:2px;
    }

    .btn:hover{
      background:var(--blue-dark);
      transform:translateY(-1px);
    }

    .btn:active{
      transform:translateY(0);
    }

    /* ==================================================
       MESAJ
    ================================================== */

    .msg{
      min-height:18px;
      font-size:13px;
      line-height:1.4;
    }

    .error{
      color:var(--red);
    }

    .success{
      color:var(--green);
    }

    .hide{
      display:none;
    }

    /* ==================================================
       ALT BİLGİ
    ================================================== */

    .footer-note{
      text-align:center;
      margin-top:22px;
      font-size:11px;
      color:#9aa6b5;
    }

    /* ==================================================
       MOBİL
    ================================================== */

    @media(max-width:600px){

      .wrap{
        padding:18px 12px;
      }

      .auth-card{
        padding:24px 18px;
        border-radius:18px;
      }

      .brand-logo{
        width:90px;
        height:90px;
      }

      .brand h1{
        font-size:27px;
      }

      .row{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>

<body>

  <div class="wrap">

    <div class="auth-card">

      <!-- ==================================================
           MARKA
      ================================================== -->

      <div class="brand">

        <div class="brand-logo">
          <img
            src="/D.png"
            alt="SahaCari Logo"
          >
        </div>

        <h1>İŞ YÖNETİM</h1>

        <p>
          Müşteri, hesap ve saha işlerinizi
          tek yerden yönetin.
        </p>

      </div>


      <!-- ==================================================
           SEKME
      ================================================== -->

      <div class="tabs">

        <button
          id="lt"
          type="button"
          class="active"
          onclick="show('login')"
        >
          Giriş Yap
        </button>

        <button
          id="rt"
          type="button"
          onclick="show('register')"
        >
          Kayıt Ol
        </button>

      </div>


      <!-- ==================================================
           GİRİŞ
      ================================================== -->

      <form
        id="login"
        class="form"
        onsubmit="login(event)"
      >

        <div class="field">

          <label for="le">
            E-posta
          </label>

          <input
            id="le"
            type="email"
            placeholder="ornek@firma.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="lp">
            Şifre
          </label>

          <input
            id="lp"
            type="password"
            placeholder="Şifrenizi girin"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          class="btn"
          type="submit"
        >
          Giriş Yap
        </button>


        <div
          id="lm"
          class="msg"
        ></div>

      </form>


      <!-- ==================================================
           KAYIT
      ================================================== -->

      <form
        id="register"
        class="form hide"
        onsubmit="register(event)"
      >

        <div class="row">

          <div class="field">

            <label for="rn">
              Ad Soyad
            </label>

            <input
              id="rn"
              placeholder="Adınız Soyadınız"
              autocomplete="name"
              required
            >

          </div>


          <div class="field">

            <label for="re">
              E-posta
            </label>

            <input
              id="re"
              type="email"
              placeholder="ornek@firma.com"
              autocomplete="email"
              required
            >

          </div>

        </div>


        <div class="field">

          <label for="rp">
            Şifre
          </label>

          <input
            id="rp"
            type="password"
            placeholder="En az 6 karakter"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <div class="row">

          <div class="field">

            <label for="cn">
              Firma Adı
            </label>

            <input
              id="cn"
              placeholder="Firma adınız"
              required
            >

          </div>


          <div class="field">

            <label for="tax">
              Vergi No
            </label>

            <input
              id="tax"
              placeholder="Vergi numarası"
            >

          </div>

        </div>


        <div class="row">

          <div class="field">

            <label for="ph">
              Telefon
            </label>

            <input
              id="ph"
              type="tel"
              placeholder="05xx xxx xx xx"
            >

          </div>


          <div class="field">

            <label for="ce">
              Firma E-postası
            </label>

            <input
              id="ce"
              type="email"
              placeholder="firma@ornek.com"
            >

          </div>

        </div>


        <div class="field">

          <label for="addr">
            Adres
          </label>

          <textarea
            id="addr"
            placeholder="Firma adresi"
          ></textarea>

        </div>


        <button
          class="btn"
          type="submit"
        >
          Şirket Hesabı Oluştur
        </button>


        <div
          id="rm"
          class="msg"
        ></div>

      </form>


      <div class="footer-note">
        Güvenli işletme yönetim sistemi
      </div>

    </div>

  </div>


  <script>

    /* ==================================================
       ELEMENTLER
    ================================================== */

    const loginForm =
      document.getElementById('login');

    const registerForm =
      document.getElementById('register');

    const loginTab =
      document.getElementById('lt');

    const registerTab =
      document.getElementById('rt');

    const loginMessage =
      document.getElementById('lm');

    const registerMessage =
      document.getElementById('rm');


    /* ==================================================
       GİRİŞ / KAYIT SEKME
    ================================================== */

    function show(type){

      const isLogin =
        type === 'login';


      loginForm.classList.toggle(
        'hide',
        !isLogin
      );


      registerForm.classList.toggle(
        'hide',
        isLogin
      );


      loginTab.classList.toggle(
        'active',
        isLogin
      );


      registerTab.classList.toggle(
        'active',
        !isLogin
      );


      if(loginMessage){

        loginMessage.textContent =
          '';

        loginMessage.className =
          'msg';

      }


      if(registerMessage){

        registerMessage.textContent =
          '';

        registerMessage.className =
          'msg';

      }

    }


    /* ==================================================
       API
    ================================================== */

    async function req(url,data){

      const response =
        await fetch(
          url,
          {
            method:'POST',
            headers:{
              'Content-Type':
                'application/json'
            },
            body:
              JSON.stringify(data)
          }
        );


      let result={};


      try{

        result =
          await response.json();

      }catch(error){

        throw new Error(
          'Sunucudan geçersiz cevap geldi.'
        );

      }


      if(!response.ok){

        throw new Error(
          result.error ||
          'İşlem başarısız.'
        );

      }


      return result;
    }


    /* ==================================================
       GİRİŞ
    ================================================== */

    async function login(e){

      e.preventDefault();


      loginMessage.textContent =
        '';

      loginMessage.className =
        'msg';


      const email =
        document
          .getElementById('le')
          .value
          .trim();


      const password =
        document
          .getElementById('lp')
          .value;


      if(!email || !password){

        loginMessage.textContent =
          'E-posta ve şifre zorunludur.';

        loginMessage.className =
          'msg error';

        return;
      }


      try{

        const data =
          await req(
            '/api/auth/login',
            {
              email,
              password
            }
          );


        if(!data.token){

          throw new Error(
            'Giriş anahtarı alınamadı.'
          );

        }


        localStorage.setItem(
          'yavuz_token',
          data.token
        );


        window.location.href =
          '/panel.html';

      }catch(error){

        console.error(
          'Giriş hatası:',
          error
        );


        loginMessage.textContent =
          error.message ||
          'Giriş yapılamadı.';

        loginMessage.className =
          'msg error';

      }

    }


    /* ==================================================
       KAYIT
    ================================================== */

    async function register(e){

      e.preventDefault();


      registerMessage.textContent =
        '';

      registerMessage.className =
        'msg';


      const name =
        document
          .getElementById('rn')
          .value
          .trim();


      const email =
        document
          .getElementById('re')
          .value
          .trim();


      const password =
        document
          .getElementById('rp')
          .value;


      const companyName =
        document
          .getElementById('cn')
          .value
          .trim();


      const taxNumber =
        document
          .getElementById('tax')
          .value
          .trim();


      const phone =
        document
          .getElementById('ph')
          .value
          .trim();


      const companyEmail =
        document
          .getElementById('ce')
          .value
          .trim();


      const address =
        document
          .getElementById('addr')
          .value
          .trim();


      /* ==================================================
         KONTROLLER
      ================================================== */

      if(
        !name ||
        !email ||
        !password ||
        !companyName
      ){

        registerMessage.textContent =
          'Ad soyad, e-posta, şifre ve firma adı zorunludur.';

        registerMessage.className =
          'msg error';

        return;
      }


      if(password.length < 6){

        registerMessage.textContent =
          'Şifre en az 6 karakter olmalıdır.';

        registerMessage.className =
          'msg error';

        return;
      }


      try{

        const data =
          await req(
            '/api/auth/register',
            {
              full_name:name,

              email:email,

              password:password,

              company:{
                company_name:
                  companyName,

                tax_number:
                  taxNumber || null,

                phone:
                  phone || null,

                email:
                  companyEmail || null,

                address:
                  address || null
              }
            }
          );


        if(data.token){

          localStorage.setItem(
            'yavuz_token',
            data.token
          );


          registerMessage.textContent =
            'Şirket hesabınız oluşturuldu.';

          registerMessage.className =
            'msg success';


          window.location.href =
            '/panel.html';

          return;
        }


        registerMessage.textContent =
          'Kayıt başarılı. Giriş yapabilirsiniz.';

        registerMessage.className =
          'msg success';


        show('login');

      }catch(error){

        console.error(
          'Kayıt hatası:',
          error
        );


        registerMessage.textContent =
          error.message ||
          'Kayıt yapılamadı.';

        registerMessage.className =
          'msg error';

      }

    }


    /* ==================================================
       BAŞLANGIÇ
    ================================================== */

    show('login');

  </script>

</body>
</html>
